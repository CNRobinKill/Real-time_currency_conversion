<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>Real-time Currency Conversion</title>
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css?v=202611210345">
</head>
<body>
<main class="card">
  <header>
    <div class="brand">
      <img class="logo" src="logo.svg" alt="" width="38" height="38">
      <h1 id="uiTitle">Currency Converter</h1>
    </div>
    <select id="langSelect" aria-label="Language"></select>
  </header>
  <p class="sub" id="uiSub">Type in any box — all other currencies update instantly at the live rate.</p>

  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="board"></canvas>
    <input id="editor" class="editor hidden" type="number" inputmode="decimal" step="any" min="0">
  </div>
  <p id="uiHint" class="hintbar"></p>

  <div class="actions">
    <button id="addBtn" class="primary"></button>
    <button id="refreshBtn"></button>
  </div>

  <p id="updated" class="updated"></p>
  <p id="error" class="error"></p>
</main>

<div id="picker" class="picker hidden" role="dialog" aria-modal="true">
  <div class="picker-sheet">
    <div class="picker-head">
      <h2 id="pickerTitle"></h2>
      <button id="pickerClose" class="close">✕</button>
    </div>
    <input id="pickerSearch" type="search">
    <p id="pickerNote" class="picker-note"></p>
    <div id="pickerGrid" class="picker-grid"></div>
  </div>
</div>

<script src="app.js?v=202611210345"></script>
</body>
</html>
