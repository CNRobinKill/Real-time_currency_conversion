<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Real-time Currency Conversion</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="card">
  <header>
    <h1 id="uiTitle">Currency Converter</h1>
    <select id="langSelect" aria-label="Language"></select>
  </header>
  <p class="sub" id="uiSub">Type in any box — all other currencies update instantly at the live rate.</p>

  <div id="board"></div>
  <p id="uiHint" class="hintbar"></p>

  <div class="actions">
    <button id="addBtn" class="primary"></button>
    <button id="refreshBtn"></button>
  </div>

  <p id="updated" class="updated"></p>
  <p id="error" class="error"></p>
</main>

<div id="picker" class="picker hidden" role="dialog" aria-modal="true">
  <div class="picker-sheet">
    <div class="picker-head">
      <h2 id="pickerTitle"></h2>
      <button id="pickerClose" class="close">✕</button>
    </div>
    <input id="pickerSearch" type="search">
    <div id="pickerGrid" class="picker-grid"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
