<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Real-time Currency Conversion</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="card">
  <h1>💱 Real-time Currency Conversion</h1>
  <p class="sub">Type an amount in <b>any</b> currency's box — every other box
  updates instantly at the live rate. Add or remove currencies as you like.</p>

  <div id="board"></div>

  <div class="row">
    <label>Add currency
      <select id="addSelect"></select>
    </label>
    <button id="addBtn">+ Add</button>
    <button id="refresh">↻ Refresh rates</button>
  </div>

  <p id="updated" class="updated"></p>
  <p id="error" class="error"></p>
</main>
<script src="app.js"></script>
</body>
</html>
